name: Update SKHY ADR disparity data

on:
  schedule:
    # 미국 증시 마감 후(평일 22:00 UTC ≈ 16:00~18:00 ET) 하루 1회 EOD 스냅샷.
    # 이 시점이면 같은 날 한국 종가·환율도 이미 확정돼 있어 세 값이 가장 신선하게 짝맞춰진다.
    # 정각 슬롯은 GitHub 부하가 몰려 schedule 이 크게 밀린다(관측상 최대 +7시간,
    # 같은 계정의 '30 9' 슬롯은 아예 누락됐다). 임의의 분으로 옮겨 지연을 줄인다.
    - cron: '38 22 * * 1-5'
  workflow_dispatch:        # 수동 실행도 허용

permissions:
  contents: write           # data/skhy.json 커밋·푸시용

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data & compute disparity
        run: python scripts/update_data.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 사항 없음 (휴장일 등) — 커밋 생략"
          else
            git commit -m "data: update SKHY ADR disparity ($(date -u +%Y-%m-%d))"
            git push
          fi
